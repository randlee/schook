[atm]
default_team = "schook"
identity = "team-lead"

[team."schook"]
co_leaders = ["quality-mgr"]

[[atm.post_send_hooks]]
recipient = "chook"
command = ["scripts/atm-nudge.py", "chook"]

[[atm.post_send_hooks]]
recipient = "quality-mgr"
command = ["scripts/atm-nudge.py", "quality-mgr"]

[atm.idle_notify]
recipient = "team-lead"

[atm.idle_notify.agent.chook]
seconds = 60

# ── rmux: tmux pane layout for schook ────────────────────────────────
[rmux]
session = "atm-dev"

[[rmux.windows]]
name = "schook"
layout = "even-horizontal"

[[rmux.windows.panes]]
name = "team-lead"
tmux_pane_id = "%7"
model = "sonnet"
color = "green"
dir = "/Users/randlee/Documents/github/schook"
env = { ATM_IDENTITY = "team-lead", ATM_TEAM = "schook", CLAUDE_CODE_TASK_LIST_ID = "schook" }

[[rmux.windows.panes]]
name = "chook"
tmux_pane_id = "%8"
command = "codex -c features.codex_hooks=true --yolo"
dir = "/Users/randlee/Documents/github/schook"
env = { ATM_IDENTITY = "chook", ATM_TEAM = "schook", CLAUDE_CODE_TASK_LIST_ID = "schook" }

[[rmux.windows.panes]]
name = "quality-mgr"
tmux_pane_id = "%9"
model = "sonnet"
color = "green"
dir = "/Users/randlee/Documents/github/schook"
env = { ATM_IDENTITY = "quality-mgr", ATM_TEAM = "schook", CLAUDE_CODE_TASK_LIST_ID = "schook" }
