[package]
name = "tool-output-gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Gate hook plugin enforcing tool output policies for sc-hooks runtime"
publish = false

[dependencies]
mimalloc = "0.1.43"
sc-hooks-core = { version = "0.1.0", path = "../../crates/sc-hooks-core" }
sc-hooks-sdk = { version = "0.1.0", path = "../../crates/sc-hooks-sdk" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[dev-dependencies]
tempfile = "3.23.0"
